name: CI - Lint & Tests Ingestion Bronze

# Déclenchement : à chaque push et pull request sur les branches principales.
# Ce CI ne lance JAMAIS le vrai script d'ingestion (pas d'appel réseau réel,
# pas de vraies credentials AWS) — il valide uniquement la qualité du code.
on:
  push:
    branches: [main, develop]
    paths:
      - "ingestion/**"
      - ".github/workflows/ci-ingestion.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ingestion/**"

jobs:
  lint-and-test:
    name: Lint + Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Installation des dépendances
        working-directory: ./ingestion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint avec flake8 (style et erreurs de syntaxe)
        working-directory: ./ingestion
        run: |
          # E9, F63, F7, F82 = erreurs critiques (syntaxe, undefined names)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Vérification de style complète, en mode non-bloquant (warning only)
          flake8 . --count --max-line-length=100 --exit-zero --statistics

      - name: Exécution des tests unitaires (mocks, aucun appel réseau réel)
        working-directory: ./ingestion
        env:
          # Credentials factices, uniquement pour satisfaire les imports du module
          # Aucune vraie clé AWS n'est utilisée ou exposée dans ce workflow.
          AWS_ACCESS_KEY_ID: "fake_access_key_for_ci"
          AWS_SECRET_ACCESS_KEY: "fake_secret_key_for_ci"
          AWS_REGION: "eu-west-3"
          S3_BUCKET_BRONZE: "fake-bucket-for-ci"
        run: |
          pytest test_ingest_bronze_taxi.py -v --tb=short

      - name: Résumé
        if: success()
        run: echo "Lint et tests unitaires passés avec succès — script prêt pour exécution manuelle."
